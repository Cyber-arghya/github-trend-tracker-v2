[project]
name = "github-trend-tracker-v2"
version = "0.1.0"
description = "Autonomous GitHub Trending Tracker V2 with Relational History, All-Time Leaderboard & Supabase Storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "parsel>=1.9.0",
    "supabase>=2.34.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
